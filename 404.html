<!doctype html>

<script>
// The app shares profiles as /b/<barber-id> and /s/<salon-id>. GitHub Pages has
// no rewrites, so those paths land here and are forwarded to the real pages.
(function(){var m=location.pathname.match(/^\/(b|s)\/([^\/?#]+)\/?$/);if(m)location.replace((m[1]==='b'?'/barber.html':'/salon.html')+'?id='+encodeURIComponent(decodeURIComponent(m[2]))+location.hash)})();
</script>

<!--
  GitHub Pages serves this file for any path that isn't a real file, which
  includes the share links the app hands out: /b/<barber-id> and
  /s/<salon-id>. On an iPhone with Cutz installed those open the app
  (universal links, /.well-known/apple-app-site-association); everyone else
  lands here and is forwarded to the real profile page before anything paints.
-->
<script>
(function(){
  var p=location.pathname,m;
  if((m=p.match(/\/b\/([^/]+)\/?$/)))location.replace('/barber.html?id='+m[1]+location.hash);
  else if((m=p.match(/\/s\/([^/]+)\/?$/)))location.replace('/salon.html?id='+m[1]+location.hash);
})();
</script>
